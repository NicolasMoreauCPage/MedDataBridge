{% extends 'base.html' %}
{% set title = doc_title %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 py-6">
  <!-- Breadcrumb -->
  <nav class="flex items-center space-x-2 text-sm text-slate-600 mb-6">
    <a href="/" class="hover:text-blue-600 transition-colors">🏠 Accueil</a>
    <span class="text-slate-400">/</span>
    <a href="/documentation" class="hover:text-blue-600 transition-colors">Documentation</a>
    <span class="text-slate-400">/</span>
    <span class="text-slate-800 font-medium">{{ doc_filename }}</span>
  </nav>

  <!-- Header -->
  <div class="mb-8">
    <div class="bg-gradient-to-r from-slate-600 via-gray-600 to-zinc-600 rounded-2xl p-8 text-white shadow-lg">
      <div class="flex items-center space-x-4">
        <div class="bg-white/20 backdrop-blur-sm rounded-xl p-3">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
          </svg>
        </div>
        <div>
          <h1 class="text-3xl font-bold">{{ title }}</h1>
        </div>
      </div>
    </div>
  </div>

  <!-- Content -->
  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8 mb-8">
    <article class="prose prose-slate max-w-none prose-headings:font-bold prose-h1:text-3xl prose-h2:text-2xl prose-h1:border-b prose-h1:border-blue-500 prose-h1:pb-3 prose-h2:border-b prose-h2:border-blue-500 prose-h2:pb-2 prose-a:text-blue-600 hover:prose-a:text-blue-700 prose-code:bg-gray-100 prose-code:px-1.5 prose-code:py-0.5 prose-code:rounded prose-code:before:content-none prose-code:after:content-none prose-pre:bg-slate-900 prose-pre:text-white prose-blockquote:border-l-blue-500 prose-blockquote:bg-blue-50 prose-blockquote:not-italic">
      {{ doc_content | safe }}
    </article>
  </div>
</div>
{% endblock %}
