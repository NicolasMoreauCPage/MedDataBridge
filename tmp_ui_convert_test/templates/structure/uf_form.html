{%extends "base.html" %}

{%block content %}
<div class="max-w-4xl mx-auto px-4 py-6">
    <!-- Breadcrumb -->
    <nav class="flex items-center space-x-2 text-sm text-slate-600 mb-6">
        <a href="/" class="hover:text-blue-600 transition-colors">🏠 Accueil</a>
        <span class="text-slate-400">/</span>
        <a href="/structure" class="hover:text-blue-600 transition-colors">Structure</a>
        <span class="text-slate-400">/</span>
        <span class="text-slate-800 font-medium">Unité Fonctionnelle</span>
    </nav>

    <!-- Header -->
    <div class="mb-8">
        <div class="btn btn-primary">
            <div class="flex items-center space-x-4">
                <div class="btn">
                    <div class="text-3xl">🏛️</div>
                </div>
                <div>
                    <h1 class="text-3xl font-bold">Modifier Unité Fonctionnelle</h1>
                    <p class="text-white/80 mt-1">Édition des informations</p>
                </div>
            </div>
        </div>
    </div>

    <div class="btn">
        <div>
      <form action="/structure/ufs/{{ uf.id }}" method="POST">
        <div class="shadow sm:overflow-hidden sm:rounded-md">
          <div class="btn">
            <div class="grid grid-cols-6 gap-6">
              <div class="col-span-6 sm:col-span-4">
                <label for="name" class="block text-sm font-medium text-gray-700">Nom</label>
                <input type="text" name="name" id="name" value="{{ uf.name }}" required
                  class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
              </div>

              <div class="col-span-6 sm:col-span-4">
                <label for="identifier" class="block text-sm font-medium text-gray-700">Identifiant</label>
                <input type="text" name="identifier" id="identifier" value="{{ uf.identifier or '' }}"
                  class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
              </div>

              <div class="col-span-6 sm:col-span-3">
                <label for="service_id" class="block text-sm font-medium text-gray-700">Service</label>
                <select id="service_id" name="service_id"
                  class="btn">
                  {% for s in services %}
                  <option value="{{ s.id }}" {{ 'selected' if uf.service_id == s.id else '' }}>
                    {{ s.name }}
                  </option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-span-6 sm:col-span-3">
                <label for="uf_type" class="block text-sm font-medium text-gray-700">Type UF</label>
                <input type="text" name="uf_type" id="uf_type" value="{{ uf.uf_type or '' }}"
                  class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
              </div>

              <div class="col-span-6 sm:col-span-3">
                <label for="um_code" class="block text-sm font-medium text-gray-700">Code UM</label>
                <input type="text" name="um_code" id="um_code" value="{{ uf.um_code or '' }}"
                  class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
              </div>

            </div>
          </div>
          <div class="btn">
            {{ button("Annuler", href="/structure/ufs/{{ uf.id }}") }}
            {{ button("Enregistrer", type='submit') }}
          </div>
        </div>
      </form>
    </div>
  </div>
  
</div>
{% endblock %}
