{% extends "base.html" %}

{% block content %}
<main class="mx-auto max-w-4xl space-y-6 px-4 py-8">
  <header>
    <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100">Générateur de scénarios de test</h1>
    <p class="mt-2 text-slate-600 dark:text-slate-300">Crée un scénario HL7 local, sans envoi automatique vers une interface.</p>
  </header>

  <form id="scenario-form" class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-700 dark:bg-slate-800">
    <label class="block text-sm font-medium" for="scenario-type">Parcours</label>
    <select id="scenario-type" class="mt-1 w-full rounded border p-2">
      <option value="admission_complete">Admission complète</option>
      <option value="transfer_patient">Transfert</option>
      <option value="discharge_patient">Sortie</option>
      <option value="bulk_admission">Admissions en masse</option>
      <option value="error_recovery">Récupération après erreur</option>
      <option value="load_test">Test de charge</option>
    </select>
    <label class="mt-4 block text-sm font-medium" for="patient-count">Nombre de patients</label>
    <input id="patient-count" class="mt-1 w-full rounded border p-2" type="number" min="1" max="500" value="1">
    <button class="mt-5 rounded bg-blue-600 px-4 py-2 font-medium text-white hover:bg-blue-700" type="submit">Générer</button>
  </form>

  <pre id="scenario-result" class="hidden overflow-auto rounded-xl bg-slate-950 p-5 text-sm text-slate-100"></pre>
</main>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('scenario-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const result = document.getElementById('scenario-result');
  const response = await fetch('/test-scenario-generator/generate', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      scenario_type: document.getElementById('scenario-type').value,
      patient_count: Number(document.getElementById('patient-count').value),
    }),
  });
  result.classList.remove('hidden');
  result.textContent = JSON.stringify(await response.json(), null, 2);
});
</script>
{% endblock %}
