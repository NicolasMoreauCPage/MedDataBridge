{% extends "base.html" %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 py-6">
  <!-- Breadcrumb -->
  <nav class="flex items-center space-x-2 text-sm text-slate-600 mb-6">
    <a href="/" class="hover:text-blue-600 transition-colors">🏠 Accueil</a>
    <span class="text-slate-400">/</span>
    <span class="text-slate-800 font-medium">Page</span>
  </nav>

  <!-- Header -->
  <div class="mb-8">
    <div class="bg-gradient-to-r from-blue-600 via-cyan-600 to-teal-600 rounded-2xl p-8 text-white shadow-lg">
      <div class="flex items-center space-x-4">
        <div class="bg-white/20 backdrop-blur-sm rounded-xl p-3">
          <div class="text-3xl">🔹</div>
        </div>
        <div>
          <h1 class="text-3xl font-bold">Page</h1>
        </div>
      </div>
    </div>
  </div>

  <!-- Contenu confirmation -->
  <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-lg p-8">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-red-100 mb-4">
        <svg class="w-10 h-10 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-slate-900 mb-2">{{ title|default('Confirmer la suppression') }}</h2>
      <p class="text-slate-600">Êtes-vous sûr de vouloir supprimer <strong>{{ object_label }}</strong> ?</p>
      <p class="text-sm text-red-600 mt-2">Cette action est irréversible.</p>
    </div>

    <form method="post" action="{{ action_url }}" class="flex gap-4 justify-center">
      <button type="submit" class="px-6 py-3 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-xl transition-colors">
        Confirmer la suppression
      </button>
      <a href="{{ back_url }}" class="px-6 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl transition-colors">
        Annuler
      </a>
    </form>
  </div>
</div>
{% endblock %}
