{% extends 'base.html' %}
{% set title = doc_title %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 py-6">
  <!-- Breadcrumb -->
    <nav class="flex items-center space-x-2 text-sm text-slate-600 mb-6">
    <a href="/" class="hover:text-blue-600 transition-colors">🏠 Accueil</a>
    <span class="text-slate-400">/</span>
    <span class="text-slate-800 font-medium">{{ title }}</span>
  </nav>

  <!-- Header -->
  <div class="mb-8">
    <div class="bg-gradient-to-r from-slate-600 via-gray-600 to-zinc-600 rounded-2xl p-8 text-white shadow-lg">
      <div class="flex items-center space-x-4">
        <div class="bg-white/20 backdrop-blur-sm rounded-xl p-3">
          <div class="text-3xl">📚</div>
        </div>
        <div>
          <h1 class="text-3xl font-bold">{{ title }}</h1>
        </div>
      </div>
    </div>
  </div>
<main id="main-content" class="mx-auto max-w-content px-4 py-8">
  <div class="mb-4 flex items-center gap-2 text-sm text-slate-500">
    <a href="/" class="hover:text-slate-700">Accueil</a>
    <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/></svg>
    <a href="/documentation" class="hover:text-slate-700">Documentation</a>
    <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/></svg>
    <span class="text-slate-700">{{ doc_filename }}</span>
  </div>

  <!-- Wrapper pour le contenu HTML -->
  <div class="prose prose-sm max-w-none">
    <!-- Désactiver les styles prose pour le contenu inline HTML qui a déjà ses propres styles -->
    <div class="not-prose">
      {{ doc_content | safe }}
    </div>
  </div>
</main>

<style>
  /* Assurer la cohérence du style avec le reste du programme */
  main {
    min-height: calc(100vh - 200px);
  }
  
  /* Styles pour améliorer la lisibilité des docs HTML enveloppés */
  main h1, main h2, main h3, main h4, main h5, main h6 {
    @apply text-slate-800;
    margin-top: 1.5em;
    margin-bottom: 0.5em;
    font-weight: 600;
  }
  
  main h1 { font-size: 2em; }
  main h2 { font-size: 1.5em; }
  main h3 { font-size: 1.25em; }
  
  main p, main li {
    @apply text-slate-700;
    line-height: 1.6;
  }
  
  main a {
    @apply text-blue-600;
    text-decoration: underline;
  }
  
  main a:hover {
    @apply text-blue-700;
  }
  
  main code {
    @apply bg-gray-100 border border-gray-200;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 0.9em;
  }
  
  main pre {
    @apply bg-gray-50 border border-gray-200;
    padding: 1em;
    border-radius: 8px;
    overflow-x: auto;
  }
  
  main pre code {
    background: transparent;
    border: none;
    padding: 0;
  }
  
  main table {
    border-collapse: collapse;
    width: 100%;
    margin: 1em 0;
  }
  
  main table thead {
    @apply bg-gray-50;
  }
  
  main table th {
    padding: 0.75em;
    @apply border border-gray-200 text-left font-semibold text-slate-800;
  }
  
  main table td {
    padding: 0.75em;
    @apply border border-gray-200 text-slate-700;
  }
  
  main table tbody tr:nth-child(odd) {
    @apply bg-gray-50;
  }
  
  main blockquote {
    @apply border-l-4 border-blue-500;
    padding-left: 1em;
    margin-left: 0;
    @apply text-slate-600;
  }
  
  /* Styles spécifiques pour le rendu Markdown */
  .prose h1, .prose h2, .prose h3, .prose h4, .prose h5, .prose h6 {
    @apply text-slate-900;
    margin-top: 1.5em;
    margin-bottom: 0.5em;
  }
  
  .prose h1 { font-size: 2em; @apply border-b-2 border-blue-500; padding-bottom: 0.3em; }
  .prose h2 { font-size: 1.5em; @apply border-b border-blue-500; padding-bottom: 0.2em; }
  .prose h3 { font-size: 1.25em; }
  
  .prose p { margin-bottom: 1em; line-height: 1.6; }
  
  .prose ul, .prose ol { margin-bottom: 1em; padding-left: 2em; }
  .prose li { margin-bottom: 0.5em; }
  
  .prose code {
    @apply bg-gray-100;
    padding: 0.2em 0.4em;
    border-radius: 3px;
    font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
    font-size: 0.9em;
  }
  
  .prose pre {
    @apply bg-gray-100;
    padding: 1em;
    border-radius: 6px;
    overflow-x: auto;
    margin-bottom: 1em;
  }
  
  .prose pre code {
    background: none;
    padding: 0;
    border-radius: 0;
  }
  
  .prose blockquote {
    @apply border-l-4 border-blue-500;
    padding-left: 1em;
    margin-left: 0;
    font-style: italic;
    @apply text-slate-600;
  }
  
  .prose table {
    border-collapse: collapse;
    width: 100%;
    margin-bottom: 1em;
  }
  
  .prose th, .prose td {
    @apply border border-gray-200;
    padding: 0.5em;
    text-align: left;
  }
  
  .prose th {
    @apply bg-gray-50 font-bold;
  }
</style>
{% endblock %}
