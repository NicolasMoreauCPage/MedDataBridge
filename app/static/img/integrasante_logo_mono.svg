    <line x1="0" y1="0" x2="-14" y2="-14" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="0" x2="14" y2="-14" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="0" x2="-14" y2="14" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="0" x2="14" y2="14" stroke-width="2" stroke-linecap="round" />

    <circle cx="-14" cy="-14" r="4" />
    <circle cx="14" cy="-14" r="4" />
    <circle cx="-14" cy="14" r="4" />
    <circle cx="14" cy="14" r="4" />

    <circle cx="0" cy="0" r="7" />
