{%extends "base.html" %}

{%block content %}
<div class="max-w-4xl mx-auto px-4 py-6">
    <!-- Breadcrumb -->
    <nav class="flex items-center space-x-2 text-sm text-slate-600 mb-6">
        <a href="/" class="hover:text-blue-600 transition-colors">🏠 Accueil</a>
        <span class="text-slate-400">/</span>
        <a href="/structure" class="hover:text-blue-600 transition-colors">Structure</a>
        <span class="text-slate-400">/</span>
        <span class="text-slate-800 font-medium">Pôle</span>
    </nav>

    <!-- Header -->
    <div class="mb-8">
        <div class="bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 rounded-2xl p-8 text-white shadow-lg">
            <div class="flex items-center space-x-4">
                <div class="bg-white/20 backdrop-blur-sm rounded-xl p-3">
                    <div class="text-3xl">🏢</div>
                </div>
                <div>
                    <h1 class="text-3xl font-bold">Modifier Pôle</h1>
                    <p class="text-white/80 mt-1">Édition des informations</p>
                </div>
            </div>
        </div>
    </div>

    <div class="bg-white rounded-2xl shadow-lg border-2 border-slate-200 p-8">
        <div>
      <form action="/structure/poles/{{ pole.id }}" method="POST">
        <div class="shadow sm:overflow-hidden sm:rounded-md">
          <div class="space-y-6 bg-white px-4 py-5 sm:p-6">
            <div class="grid grid-cols-6 gap-6">
              <div class="col-span-6 sm:col-span-4">
                <label for="name" class="block text-sm font-medium text-gray-700">Nom</label>
                <input type="text" name="name" id="name" value="{{ pole.name }}" required
                  class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
              </div>

              <div class="col-span-6 sm:col-span-4">
                <label for="identifier" class="block text-sm font-medium text-gray-700">Identifiant</label>
                <input type="text" name="identifier" id="identifier" value="{{ pole.identifier or '' }}"
                  class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
              </div>

              <div class="col-span-6 sm:col-span-4">
                <label for="entite_geo_id" class="block text-sm font-medium text-gray-700">Entité Géographique</label>
                <select id="entite_geo_id" name="entite_geo_id"
                  class="mt-1 block w-full rounded-md border border-gray-300 bg-white py-2 px-3 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-indigo-500 sm:text-sm">
                  {% for eg in entites_geographiques %}
                  <option value="{{ eg.id }}" {{ 'selected' if pole.entite_geo_id == eg.id else '' }}>
                    {{ eg.name }}
                  </option>
                  {% endfor %}
                </select>
              </div>
            </div>
          </div>
          <div class="bg-gray-50 px-4 py-3 text-right sm:px-6 space-x-2">
            <a href="/structure/poles/{{ pole.id }}" 
              class="inline-flex justify-center rounded-md border border-gray-300 bg-white py-2 px-4 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
              Annuler
            </a>
            <button type="submit"
              class="inline-flex justify-center rounded-md border border-transparent bg-indigo-600 py-2 px-4 text-sm font-medium text-white shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
              Enregistrer
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
  
</div>
{% endblock %}
