[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "MedData_Bridge"
version = "2.0.2"
authors = [
  { name="Nicolas Moreau", email="nicolas.moreau@cpage.fr" },
]
description = "Plateforme de qualification et de test d'interopérabilité HL7, IHE PAM, HPRIM et FHIR"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# Les manifestes canoniques sont requirements-runtime.txt et
# requirements-dev.txt. Le paquet Python ne maintient pas une troisième liste.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.30.1",
    "sqlmodel==0.0.21",
    "sqlalchemy==2.0.32",
    "pydantic==2.13.5",
    "jinja2==3.1.6",
    "python-multipart==0.0.31",
    "sqladmin==0.27.1",
    "httpx==0.27.0",
    "python-dotenv==1.2.2",
    "markdown==3.8.1",
    "python-slugify==8.0.1",
    "PyJWT[crypto]==2.15.0",
    "itsdangerous==2.2.0",
    "email-validator==2.2.0",
    "dnspython==2.6.1",
    "alembic==1.13.2",
    "psycopg[binary]==3.1.19",
    "passlib==1.7.4",
    "redis==5.0.8",
    "prometheus-client==0.20.0",
    "xmlschema==3.3.2",
    "lxml==6.1.0",
    "openpyxl==3.1.5",
    "reportlab==4.2.2",
    "pillow==12.3.0",
]

[project.urls]
"Homepage" = "https://github.com/NicolasMoreauCPage/MedDataBridge"
"Bug Tracker" = "https://github.com/NicolasMoreauCPage/MedDataBridge/issues"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff.lint.per-file-ignores]
# Les tests historiques sont exécutés, mais plusieurs d'entre eux sont des
# scripts de diagnostic conservés tels quels. Les règles de style ci-dessous
# y sont isolées : elles restent bloquantes dans le produit (``app/``) et tout
# nouveau test doit respecter Ruff par défaut.
"tests/**" = ["E402", "E702", "E712", "E722", "E741", "F401", "F841"]
