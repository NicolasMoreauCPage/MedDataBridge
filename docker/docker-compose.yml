services:
  # Application principale
  medbridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${MEDBRIDGE_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: lan
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-medbridge}:${POSTGRES_PASSWORD:-medbridge-lan-only}@postgres:5432/${POSTGRES_DB:-medbridge}
      REDIS_URL: redis://redis:6379
      # Le LAN est le mode de départ voulu. Le fichier
      # docker-compose.exposed.yml force l'authentification pour toute
      # exposition hors de ce périmètre.
      SECURITY_ENABLED: ${SECURITY_ENABLED:-false}
      # Docker Compose loads a root .env automatically when it exists. Empty
      # defaults deliberately keep `docker compose config` usable from a clean
      # checkout; the application then emits its normal startup diagnostic if
      # the operator has not supplied the required runtime keys.
      SECRET_KEY: ${SECRET_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - medbridge_data:/app/data
      - medbridge_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-medbridge}
      - POSTGRES_USER=${POSTGRES_USER:-medbridge}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-medbridge-lan-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medbridge}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Cache Redis
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Reverse proxy Nginx (optionnel)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - medbridge
    restart: unless-stopped
    profiles:
      - nginx

  # Monitoring avec Prometheus (optionnel)
  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  medbridge_data:
  medbridge_logs:
  postgres_data:
  redis_data:
  prometheus_data:

networks:
  default:
    name: medbridge_network
