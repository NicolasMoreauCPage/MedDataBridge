{% extends 'base.html' %}
{% set title = doc_title %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 py-6">
  <!-- Breadcrumb -->
  <nav class="flex items-center space-x-2 text-sm text-slate-600 mb-6">
    <a href="/" class="hover:text-blue-600 transition-colors">🏠 Accueil</a>
    <span class="text-slate-400">/</span>
    <span class="text-slate-800 font-medium">{{ doc_title }}</span>
  </nav>

  <!-- Header -->
  <div class="mb-8">
    <div class="btn btn-primary">
      <div class="flex items-center space-x-4">
        <div class="btn">
          <div class="text-3xl">📚</div>
        </div>
        <div>
          <h1 class="text-3xl font-bold">{{ doc_title }}</h1>
        </div>
      </div>
    </div>
  </div>
<main id="main-content" class="mx-auto max-w-content px-4 py-8 prose">
  <h2 class="text-2xl font-semibold">{{ doc_title }}</h2>
  <div class="mt-4">{{ doc_content | safe }}</div>
</main>
{% endblock %}
