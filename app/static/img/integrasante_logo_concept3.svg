<svg xmlns="http://www.w3.org/2000/svg" viewBox="25 15 265 60" width="320" height="100">
  <defs>
    <linearGradient id="network-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Logo Icon: Network with central node -->
  <g transform="translate(20, 20)">
    <!-- Background glow -->
    <circle cx="30" cy="25" r="25" fill="url(#center-glow)"/>
    
    <!-- Connection lines -->
    <line x1="30" y1="25" x2="10" y2="5" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
    <line x1="30" y1="25" x2="50" y2="5" stroke="#8B5CF6" stroke-width="2" opacity="0.6"/>
    <line x1="30" y1="25" x2="10" y2="45" stroke="#8B5CF6" stroke-width="2" opacity="0.6"/>
    <line x1="30" y1="25" x2="50" y2="45" stroke="#A855F7" stroke-width="2" opacity="0.6"/>
    
    <!-- Peripheral nodes (hospitals/systems) -->
    <circle cx="10" cy="5" r="4" fill="#3B82F6" stroke="white" stroke-width="1.5"/>
    <circle cx="50" cy="5" r="4" fill="#8B5CF6" stroke="white" stroke-width="1.5"/>
    <circle cx="10" cy="45" r="4" fill="#8B5CF6" stroke="white" stroke-width="1.5"/>
    <circle cx="50" cy="45" r="4" fill="#A855F7" stroke="white" stroke-width="1.5"/>
    
    <!-- Central node (IntegraSanté hub) -->
    <circle cx="30" cy="25" r="8" fill="url(#network-gradient)" stroke="white" stroke-width="2"/>
    
    <!-- Central icon (connection symbol) -->
    <g transform="translate(30, 25)">
      <line x1="-3" y1="0" x2="3" y2="0" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="0" y1="-3" x2="0" y2="3" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="1" fill="white"/>
    </g>
    
    <!-- Data flow particles (animation suggestion) -->
    <circle cx="20" cy="15" r="1.5" fill="#3B82F6" opacity="0.7"/>
    <circle cx="40" cy="15" r="1.5" fill="#8B5CF6" opacity="0.7"/>
    <circle cx="20" cy="35" r="1.5" fill="#A855F7" opacity="0.7"/>
  </g>
  
  <!-- Text: IntegraSanté -->
  <text x="85" y="42" font-family="Outfit, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#1E293B" letter-spacing="-0.5">
    IntegraSanté
  </text>
  
  <!-- Text: by CPage -->
  <text x="85" y="58" font-family="Outfit, -apple-system, sans-serif" font-size="13" font-weight="300" fill="#64748B" letter-spacing="0.5">
    by CPage
  </text>
  
  <!-- Tagline (optional) -->
  <text x="85" y="70" font-family="Outfit, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#94A3B8" letter-spacing="0.3">
    Au cœur de votre écosystème de santé
  </text>
</svg>
