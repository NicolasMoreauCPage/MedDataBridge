# ============================================================================
# Configuration Nginx pour MedData Bridge
# ============================================================================
# À installer dans: /etc/nginx/conf.d/meddata-bridge.conf
#
# Architecture:
#   Internet → Nginx (port 80/443) → Uvicorn (port 8000)
#
# Fonctionnalités:
#   - Reverse proxy vers uvicorn
#   - Support HTTP et HTTPS
#   - Compression gzip
#   - Cache statique
#   - Headers de sécurité
#   - Logs d'accès et erreurs
# ============================================================================

# ============================================================================
# OPTION 1: HTTP SIMPLE (port 80)
# ============================================================================
# À utiliser pour démarrer rapidement SANS SSL
# Recommandé pour tests ou réseaux internes uniquement
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    
    # Remplacer par votre nom de domaine ou IP
    server_name meddata.example.com;
    # Ou pour n'importe quelle IP:
    # server_name _;
    
    # Logs
    access_log /var/log/nginx/meddata-access.log;
    error_log /var/log/nginx/meddata-error.log;
    
    # Taille maximale upload (messages HL7, bundles FHIR)
    client_max_body_size 10M;
    
    # Headers de sécurité basiques
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Proxy vers uvicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts pour requêtes longues (génération HL7, import)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # WebSocket support (si nécessaire pour monitoring)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    # Fichiers statiques (CSS, JS, images)
    # Servis directement par Nginx pour performance
    location /static/ {
        alias /opt/meddata-bridge/app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Compression gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/x-javascript application/xml;
}


