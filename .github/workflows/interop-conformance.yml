name: Interop conformance

on:
  push:
  pull_request:

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build, migrate and check the Compose stack
        run: |
          docker compose -f docker/docker-compose.yml up -d --build --wait --wait-timeout 180
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:8000/health

      - name: Collect Compose diagnostics
        if: always()
        run: |
          docker compose -f docker/docker-compose.yml ps
          docker compose -f docker/docker-compose.yml logs --no-color

      - name: Remove ephemeral Compose resources
        if: always()
        run: docker compose -f docker/docker-compose.yml down --volumes --remove-orphans

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Verify frontend modules and CSS
        run: |
          npm ci
          npm run check-frontend

  conformance:
    runs-on: ubuntu-latest
    env:
      TESTING: "1"
      PYTHONPATH: .
      ROUNDTRIP_ARTIFACT_DIR: artifacts/roundtrip-pam
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check source integrity
        run: |
          git diff --check
          python -m compileall -q app

      - name: Migration and focused lint smoke tests
        run: |
          python -m pip install ruff
          # Ces règles correspondent à des erreurs d'exécution ou à des
          # redéfinitions ambiguës : elles restent bloquantes sur tout le code.
          ruff check app --select F821,F823,F601,F811
          # La dette historique non critique ne peut pas augmenter entre lots.
          python scripts/check_ruff_baseline.py --max-errors 461
          ruff check \
            app/services/outbox_service.py \
            app/services/scenario_output_validation.py \
            app/services/scenario_play_service.py \
            alembic/versions/b6d4e2f7a901_scenario_routing_validation_schedule.py \
            tests/unit/test_scenario_output_validation.py \
            tests/unit/test_alembic_fresh_install.py \
            tests/performance/test_scenario_play_performance.py
          pytest -q \
            tests/unit/test_settings.py \
            tests/integration/test_alembic_fresh_bootstrap.py \
            tests/unit/test_alembic_fresh_install.py \
            tests/unit/test_timeline_query_budget.py \
            tests/unit/test_openapi_inventory.py \
            tests/unit/test_structure_tree_request_context.py \
            tests/unit/test_structure_api_pagination.py \
            tests/performance/test_scenario_play_performance.py

      - name: IHE PAM France and CPage corpus
        run: |
          pytest -q tests/unit/test_ihe_pam_fr_211_conformance.py
          python scripts/true_roundtrip_cpage.py

      - name: HPRIM XML XSD and four-act roundtrip
        run: |
          pytest -q \
            tests/test_hprim_xsd_validation.py \
            tests/unit/test_hprim_ccam_roundtrip.py \
            tests/unit/test_hprim_acquittement_xsd.py \
            tests/integration/test_hprim_xml_roundtrip.py

      - name: Structure MFN and FHIR FRCore
        run: |
          pytest -q \
            tests/unit/test_mfn_export.py \
            tests/integration/test_mfn_structure_roundtrip.py \
            tests/unit/test_fhir_frcore_2_2_0_conformance.py \
            tests/integration/test_fhir_structure_roundtrip.py \
            tests/integration/test_fhir_interop.py \
            tests/unit/test_outbox_service.py \
            tests/unit/test_fhir_outbox_retry.py \
            tests/unit/test_scenario_output_validation.py \
            tests/unit/test_scenario_play_service.py \
            tests/unit/test_scenario_routing_ui.py \
            tests/unit/test_scenario_version_service.py \
            tests/unit/test_scenario_campaign_service.py \
            tests/unit/test_qualification_engine.py \
            tests/integration/test_mixed_scenario_play_roundtrip.py \
            tests/integration/test_two_ght_scenario_roundtrip.py

      - name: Generate OpenAPI inventory artefact
        run: |
          python scripts/generate_openapi_inventory.py \
            --output docs/reports/OPENAPI_INVENTORY.md

      - name: Publish qualification artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interoperability-qualification
          path: |
            artifacts/
            docs/reports/
          if-no-files-found: warn
