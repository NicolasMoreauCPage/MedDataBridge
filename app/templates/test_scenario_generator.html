{% extends "base.html" %}

{% block content %}
<main class="mx-auto max-w-4xl space-y-6 px-4 py-8">
  <header>
    <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100">Générateur de scénarios de test</h1>
    <p class="mt-2 text-slate-600 dark:text-slate-300">Crée un scénario HL7 local, sans envoi automatique vers une interface.</p>
  </header>

  <form id="scenario-form" class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-700 dark:bg-slate-800">
    <label class="block text-sm font-medium" for="scenario-type">Parcours</label>
    <select id="scenario-type" class="mt-1 w-full rounded border p-2">
      <option value="admission_complete">Admission complète</option>
      <option value="transfer_patient">Transfert</option>
      <option value="discharge_patient">Sortie</option>
      <option value="bulk_admission">Admissions en masse</option>
      <option value="error_recovery">Récupération après erreur</option>
      <option value="load_test">Test de charge</option>
    </select>
    <label class="mt-4 block text-sm font-medium" for="specialty">Spécialité</label>
    <select id="specialty" class="mt-1 w-full rounded border p-2"><option value="">Aléatoire</option><option>Médecine interne</option><option>Chirurgie</option><option>Pédiatrie</option><option>Gynécologie</option><option>Urgences</option></select>
    <label class="mt-4 block text-sm font-medium" for="patient-count">Nombre de patients</label>
    <input id="patient-count" class="mt-1 w-full rounded border p-2" type="number" min="1" max="500" value="1">
    <label class="mt-4 flex items-start gap-3 rounded-lg border border-amber-200 bg-amber-50 p-3 text-sm text-amber-900" for="inject-invalid-date"><input id="inject-invalid-date" type="checkbox" class="mt-0.5"> <span><strong>Injecter une date invalide</strong><br>Produit volontairement un message négatif pour tester le rejet.</span></label>
    <button class="mt-5 rounded bg-blue-600 px-4 py-2 font-medium text-white hover:bg-blue-700" type="submit">Générer</button>
  </form>

  <div id="scenario-feedback" class="hidden rounded-xl px-4 py-3 text-sm" role="alert"></div>
  <section id="scenario-result" class="hidden rounded-xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-700 dark:bg-slate-800" aria-live="polite">
    <div class="flex flex-wrap items-center justify-between gap-3"><div><h2 id="scenario-name" class="text-lg font-bold"></h2><p id="scenario-description" class="text-sm text-slate-600 dark:text-slate-300"></p></div><div class="flex gap-2"><button id="copy-scenario" type="button" class="rounded border px-3 py-2 text-sm font-semibold">Copier HL7</button><button id="download-scenario" type="button" class="rounded bg-slate-800 px-3 py-2 text-sm font-semibold text-white">Télécharger .hl7</button></div></div>
    <div id="scenario-messages" class="mt-5 space-y-3"></div>
  </section>
</main>
{% endblock %}

{% block scripts %}
<script defer src="{{ url_for('static', path='/js/test-scenario-generator-workspace.js') }}"></script>
{% endblock %}
