[pytest]
# Suppress SQLAlchemy SAWarning messages during tests (noisy autoflush warnings
# around VocabularyMapping detachment). Prefer fixing application code, but
# for tests we silence these to keep focus on failures.
filterwarnings =
    ignore::sqlalchemy.exc.SAWarning

# Ignore legacy/manual one-off scripts and tools that require external services
# or pre-populated DB. These are archived and should not be collected by pytest
addopts = --ignore=one_shot_legacy --ignore=scripts_manual --ignore=tools --ignore=.tmp_emit_test.py --ignore=archives --strict-markers --tb=short

# Only collect tests located under the top-level `tests/` directory. This
# prevents pytest from discovering archived or manual scripts located in
# `archives/`, `scripts_manual/`, `one_shot_legacy/`, etc.
testpaths = tests

# Define test markers for better organization and selective running
markers =
    unit: Fast unit tests with mocked dependencies
    integration: Integration tests testing real component interactions
    ui: User interface tests requiring browser/playwright
    api: API endpoint tests
    security: Security-related tests (auth, validation, injection)
    performance: Performance and load tests
    slow: Tests taking longer than 30 seconds
    critical: Critical functionality that must always work
    flaky: Tests that may fail intermittently (needs investigation)
    coverage: Tests related to coverage measurement
    mutation: Mutation testing for test quality validation
    property: Property-based tests using hypothesis for edge case validation

# Timeout for individual tests (seconds)
timeout = 300

# Enable parallel test execution (requires pytest-xdist)
# Uncomment to enable: -n auto
