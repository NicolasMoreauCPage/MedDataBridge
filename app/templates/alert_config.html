{% extends "base.html" %}

{% block title %}Configuration des Alertes - Mode Gestionnaire{% endblock %}

{% block extra_head %}
<style>
    .alert-config-container {
        max-width: 1200px;
        margin: 0 auto;
    }
    
    .rule-card {
        transition: all 0.2s;
        border-left: 4px solid transparent;
    }
    
    .rule-card.high {
        border-left-color: #EF4444;
    }
    
    .rule-card.medium {
        border-left-color: #F59E0B;
    }
    
    .rule-card.low {
        border-left-color: #3B82F6;
    }
    
    .rule-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    
    .badge-active {
        background-color: #10B981;
        color: white;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 0.75rem;
    }
    
    .badge-inactive {
        background-color: #6B7280;
        color: white;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 0.75rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="alert-config-container p-6" data-alert-config>
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-3xl font-bold text-gray-900 dark:text-slate-100">⚙️ Configuration des Alertes</h1>
            <p class="text-gray-600 dark:text-slate-300 mt-2">Gérez les seuils et règles d'alertes du Mode Gestionnaire</p>
        </div>
        <div class="space-x-2">
            <button type="button" data-alert-action="init-defaults" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                Initialiser règles par défaut
            </button>
            <button type="button" data-alert-action="create" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">
                + Nouvelle règle
            </button>
        </div>
    </div>
    
    <!-- Filtres -->
    <div class="bg-white dark:bg-slate-800 p-4 rounded-lg shadow mb-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-2">Type d'alerte</label>
                <select id="filterType" data-alert-filter class="w-full border rounded px-3 py-2">
                    <option value="">Tous les types</option>
                    <option value="suroccupation">Suroccupation</option>
                    <option value="tension">Tension</option>
                    <option value="sous_utilisation">Sous-utilisation</option>
                    <option value="dms_anormale">DMS Anormale</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-2">Sévérité</label>
                <select id="filterSeverity" data-alert-filter class="w-full border rounded px-3 py-2">
                    <option value="">Toutes les sévérités</option>
                    <option value="high">Haute (Rouge)</option>
                    <option value="medium">Moyenne (Jaune)</option>
                    <option value="low">Faible (Bleu)</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-2">Statut</label>
                <select id="filterActive" data-alert-filter class="w-full border rounded px-3 py-2">
                    <option value="">Tous</option>
                    <option value="true">Actives uniquement</option>
                    <option value="false">Inactives uniquement</option>
                </select>
            </div>
        </div>
    </div>
    
    <!-- Liste des règles -->
    <div id="rulesContainer" class="space-y-4">
        <!-- Les règles seront chargées ici dynamiquement -->
    </div>
</div>

<!-- Modal Création/Édition -->
<div id="ruleModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white dark:bg-slate-800 rounded-lg shadow-xl w-full max-w-2xl mx-4">
        <div class="p-6">
            <h2 id="modalTitle" class="text-2xl font-bold mb-4">Nouvelle règle d'alerte</h2>
            
            <form id="ruleForm" class="space-y-4">
                <input type="hidden" id="ruleId">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-2">Type d'alerte *</label>
                        <select id="alertType" required class="w-full border rounded px-3 py-2">
                            <option value="suroccupation">Suroccupation (> 100%)</option>
                            <option value="tension">Tension (> 95%)</option>
                            <option value="sous_utilisation">Sous-utilisation (< 50%)</option>
                            <option value="dms_anormale">DMS Anormale (> 150%)</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-2">Seuil (%) *</label>
                        <input type="number" id="thresholdValue" required min="0" max="200" step="0.1" 
                               class="w-full border rounded px-3 py-2" placeholder="Ex: 95.0">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-2">Sévérité *</label>
                        <select id="severity" required class="w-full border rounded px-3 py-2">
                            <option value="high">🔴 Haute (Action immédiate)</option>
                            <option value="medium">🟡 Moyenne (Surveillance)</option>
                            <option value="low">🔵 Faible (Information)</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-2">EG ID *</label>
                        <input type="number" id="egId" required min="1" class="w-full border rounded px-3 py-2" 
                               value="1" placeholder="ID Entité Géographique">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-2">Code UM (optionnel)</label>
                        <input type="text" id="umCode" class="w-full border rounded px-3 py-2" 
                               placeholder="MCO, SSR, PSY, HAD">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-2">Service ID (optionnel)</label>
                        <input type="number" id="serviceId" min="1" class="w-full border rounded px-3 py-2" 
                               placeholder="ID du service">
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-2">Description</label>
                    <textarea id="description" rows="3" class="w-full border rounded px-3 py-2" 
                              placeholder="Description de la règle..."></textarea>
                </div>
                
                <div class="flex items-center">
                    <input type="checkbox" id="isActive" checked class="mr-2">
                    <label for="isActive" class="text-sm font-medium text-gray-700 dark:text-slate-300">Règle active</label>
                </div>
            </form>
            
            <div class="flex justify-end space-x-2 mt-6">
                <button type="button" data-alert-action="close" class="px-4 py-2 border rounded hover:bg-gray-50 dark:hover:bg-slate-600">
                    Annuler
                </button>
                <button type="button" data-alert-action="save" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                    Enregistrer
                </button>
            </div>
        </div>
    </div>
</div>

<script defer src="{{ url_for('static', path='/js/alert-config-workspace.js') }}"></script>
{% endblock %}
