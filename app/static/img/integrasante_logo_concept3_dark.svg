<svg xmlns="http://www.w3.org/2000/svg" viewBox="25 15 265 70" width="320" height="100">
  <defs>
    <linearGradient id="network-gradient-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C084FC;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="center-glow-dark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Logo Icon: Network with central node (Dark theme) -->
  <g transform="translate(20, 20)">
    <!-- Background glow -->
    <circle cx="30" cy="25" r="25" fill="url(#center-glow-dark)"/>
    
    <!-- Connection lines -->
    <line x1="30" y1="25" x2="10" y2="5" stroke="#60A5FA" stroke-width="2" opacity="0.7"/>
    <line x1="30" y1="25" x2="50" y2="5" stroke="#A78BFA" stroke-width="2" opacity="0.7"/>
    <line x1="30" y1="25" x2="10" y2="45" stroke="#A78BFA" stroke-width="2" opacity="0.7"/>
    <line x1="30" y1="25" x2="50" y2="45" stroke="#C084FC" stroke-width="2" opacity="0.7"/>
    
    <!-- Peripheral nodes -->
    <circle cx="10" cy="5" r="4" fill="#60A5FA" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="50" cy="5" r="4" fill="#A78BFA" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="10" cy="45" r="4" fill="#A78BFA" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="50" cy="45" r="4" fill="#C084FC" stroke="#1E293B" stroke-width="1.5"/>
    
    <!-- Central node -->
    <circle cx="30" cy="25" r="8" fill="url(#network-gradient-dark)" stroke="#1E293B" stroke-width="2"/>
    
    <!-- Central icon -->
    <g transform="translate(30, 25)">
      <line x1="-3" y1="0" x2="3" y2="0" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="0" y1="-3" x2="0" y2="3" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="1" fill="#1E293B"/>
    </g>
    
    <!-- Data flow particles -->
    <circle cx="20" cy="15" r="1.5" fill="#60A5FA" opacity="0.8"/>
    <circle cx="40" cy="15" r="1.5" fill="#A78BFA" opacity="0.8"/>
    <circle cx="20" cy="35" r="1.5" fill="#C084FC" opacity="0.8"/>
  </g>
  
  <!-- Text: IntegraSanté -->
  <text x="85" y="42" font-family="Outfit, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#F1F5F9" letter-spacing="-0.5">
    IntegraSanté
  </text>
  
  <!-- Text: by CPage -->
  <text x="85" y="62" font-family="Outfit, -apple-system, sans-serif" font-size="13" font-weight="300" fill="#94A3B8" letter-spacing="0.5">
    by CPage
  </text>
  
  <!-- Tagline -->
  <text x="85" y="80" font-family="Outfit, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#64748B" letter-spacing="0.3">
    Au cœur de votre écosystème de santé
  </text>
</svg>
