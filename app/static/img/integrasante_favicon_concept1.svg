<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favicon-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0369A1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background (optional) -->
  <rect width="64" height="64" fill="white" rx="12"/>
  
  <!-- Bridge icon centered -->
  <g transform="translate(12, 18)">
    <!-- Left pillar -->
    <rect x="0" y="4" width="6" height="24" fill="#0369A1" rx="2"/>
    <!-- Right pillar -->
    <rect x="34" y="4" width="6" height="24" fill="#059669" rx="2"/>
    
    <!-- Bridge curve -->
    <path d="M 6 8 Q 20 0, 34 8" 
          stroke="url(#favicon-gradient)" 
          stroke-width="5" 
          fill="none" 
          stroke-linecap="round"/>
    
    <!-- Connection nodes -->
    <circle cx="6" cy="8" r="4" fill="#0369A1"/>
    <circle cx="20" cy="2" r="5" fill="#10B981"/>
    <circle cx="34" cy="8" r="4" fill="#059669"/>
    
    <!-- Medical cross -->
    <g transform="translate(16, 16)">
      <rect x="0" y="2" width="8" height="2" fill="#0EA5E9" rx="1"/>
      <rect x="3" y="-1" width="2" height="8" fill="#0EA5E9" rx="1"/>
    </g>
  </g>
</svg>
