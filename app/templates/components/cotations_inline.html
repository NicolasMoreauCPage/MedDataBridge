{# Inline Cotations Table Component #}
{# A unified, inline-editable table for CCAM, NGAP, UCD, and LPP acts #}

<div class="space-y-6">
  <!-- Unified Cotations Table -->
  <div class="bg-white rounded-2xl border-2 border-slate-200 shadow-lg overflow-hidden">
    <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-6 py-4">
      <h3 class="text-lg font-bold flex items-center gap-2">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4z"/>
          <path fill-rule="evenodd" d="M3 10a1 1 0 011-1h12a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM5 14a1 1 0 100 2 1 1 0 000-2z" clip-rule="evenodd"/>
        </svg>
        Cotations Médicales
      </h3>
    </div>

    <!-- Table -->
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="bg-slate-50 border-b-2 border-slate-200">
            <th class="px-4 py-3 text-left font-semibold text-slate-700">Type</th>
            <th class="px-4 py-3 text-left font-semibold text-slate-700">Code</th>
            <th class="px-4 py-3 text-left font-semibold text-slate-700">Libellé</th>
            <th class="px-4 py-3 text-left font-semibold text-slate-700">Détails</th>
            <th class="px-4 py-3 text-center font-semibold text-slate-700">Quantité</th>
            <th class="px-4 py-3 text-center font-semibold text-slate-700">Montant (€)</th>
            <th class="px-4 py-3 text-center font-semibold text-slate-700">Actions</th>
          </tr>
        </thead>
        <tbody id="cotations-tbody" class="divide-y divide-slate-200">
          <!-- Rows inserted here by JavaScript -->
        </tbody>
      </table>
    </div>

    <!-- Summary Footer -->
    <div class="bg-gradient-to-r from-amber-50 to-orange-50 border-t-2 border-slate-200 px-6 py-4 grid grid-cols-3 gap-4">
      <div>
        <p class="text-xs font-semibold text-amber-700 uppercase tracking-wide">Total Actes</p>
        <p class="text-2xl font-bold text-amber-900" id="total-count">0</p>
      </div>
      <div>
        <p class="text-xs font-semibold text-amber-700 uppercase tracking-wide">Montant Total</p>
        <p class="text-2xl font-bold text-amber-900">€<span id="total-amount">0.00</span></p>
      </div>
      <div class="text-right">
        <button type="button" onclick="showAddCotationForm()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold inline-flex items-center gap-2">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/>
          </svg>
          Ajouter une cotation
        </button>
      </div>
    </div>
  </div>

  <!-- Add/Edit Cotation Modal (hidden by default) -->
  <div id="cotation-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full p-6 space-y-6">
      <h2 class="text-2xl font-bold text-slate-900">Ajouter une Cotation</h2>

      <form id="cotation-form" class="space-y-4">
        <!-- Type Selection -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Type de cotation <span class="text-red-500">*</span></label>
            <select name="type" id="cotation-type" required class="w-full px-4 py-3 border-2 border-slate-200 rounded-lg focus:border-blue-500 focus:outline-none">
              <option value="">-- Sélectionner --</option>
              <option value="CCAM">CCAM (Actes chirurgicaux/médicaux)</option>
              <option value="NGAP">NGAP (Actes médicaux/paramédicaux)</option>
              <option value="UCD">UCD (Médicaments)</option>
              <option value="LPP">LPP (Dispositifs médicaux)</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Code <span class="text-red-500">*</span></label>
            <input type="text" name="code" id="cotation-code" required placeholder="Ex: JQGA004" class="w-full px-4 py-3 border-2 border-slate-200 rounded-lg focus:border-blue-500 focus:outline-none uppercase" maxlength="20">
            <p class="text-xs text-slate-500 mt-1" id="code-validation"></p>
          </div>
        </div>

        <!-- Standard/Modified -->
        <div class="grid grid-cols-2 gap-4" id="details-container" style="display: none;">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Modificateurs</label>
            <input type="text" name="modifiers" placeholder="Ex: D, E, P" class="w-full px-4 py-3 border-2 border-slate-200 rounded-lg focus:border-blue-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Quantité</label>
            <input type="number" name="quantity" value="1" min="1" class="w-full px-4 py-3 border-2 border-slate-200 rounded-lg focus:border-blue-500 focus:outline-none">
          </div>
        </div>

        <!-- Description -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Description/Notes</label>
          <textarea name="description" rows="2" placeholder="Notes cliniques ou de facturation..." class="w-full px-4 py-3 border-2 border-slate-200 rounded-lg focus:border-blue-500 focus:outline-none"></textarea>
        </div>

        <!-- Validation Messages -->
        <div id="cotation-validation" class="hidden rounded-lg border-2 border-amber-200 bg-amber-50 p-3 text-sm text-amber-900"></div>

        <!-- Buttons -->
        <div class="flex gap-3 justify-end pt-4 border-t-2 border-slate-200">
          <button type="button" onclick="closeCotationModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded-lg font-semibold">
            Annuler
          </button>
          <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold">
            Ajouter
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
// Store cotations data (would come from server in production)
let cotations = window.cotationsData || [];

function renderCotationsTable() {
  const tbody = document.getElementById('cotations-tbody');
  tbody.innerHTML = '';
  
  if (cotations.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="text-center py-8 text-slate-500">Aucune cotation enregistrée</td></tr>';
    document.getElementById('total-count').textContent = '0';
    document.getElementById('total-amount').textContent = '0.00';
    return;
  }

  let totalAmount = 0;
  const typeColors = {
    'CCAM': 'bg-emerald-50 border-emerald-200 text-emerald-700',
    'NGAP': 'bg-blue-50 border-blue-200 text-blue-700',
    'UCD': 'bg-amber-50 border-amber-200 text-amber-700',
    'LPP': 'bg-purple-50 border-purple-200 text-purple-700'
  };

  cotations.forEach((act, idx) => {
    const amount = (parseFloat(act.montant) || 0) * (parseInt(act.quantite) || 1);
    totalAmount += amount;
    
    const row = document.createElement('tr');
    row.className = 'hover:bg-slate-50 transition-colors';
    row.innerHTML = `
      <td class="px-4 py-3">
        <span class="px-3 py-1 rounded-full text-xs font-semibold border-2 ${typeColors[act.type || 'CCAM']}">
          ${act.type || '?'}
        </span>
      </td>
      <td class="px-4 py-3 font-mono font-bold text-slate-900">${act.code}</td>
      <td class="px-4 py-3 text-slate-700">${act.libelle || '—'}</td>
      <td class="px-4 py-3 text-slate-600 text-xs">
        <span class="inline-flex flex-wrap gap-1">
          ${act.modifiers ? `<span class="px-2 py-1 bg-slate-100 rounded">Mod: ${act.modifiers}</span>` : ''}
          ${act.description ? `<span class="px-2 py-1 bg-slate-100 rounded">${act.description.substring(0, 20)}...</span>` : ''}
        </span>
      </td>
      <td class="px-4 py-3 text-center">
        <input type="number" value="${act.quantite || 1}" min="1" onclick="updateCotation(${idx}, 'quantite', this.value)" class="w-12 px-2 py-1 border border-slate-200 rounded text-center text-sm">
      </td>
      <td class="px-4 py-3 text-center font-bold text-slate-900">
        € ${amount.toFixed(2)}
      </td>
      <td class="px-4 py-3 text-center space-x-2">
        <button type="button" onclick="editCotation(${idx})" class="text-blue-600 hover:text-blue-800 font-semibold text-sm">
          ✏️
        </button>
        <button type="button" onclick="deleteCotation(${idx})" class="text-red-600 hover:text-red-800 font-semibold text-sm">
          🗑️
        </button>
      </td>
    `;
    tbody.appendChild(row);
  });

  document.getElementById('total-count').textContent = cotations.length;
  document.getElementById('total-amount').textContent = totalAmount.toFixed(2);
}

function showAddCotationForm() {
  document.getElementById('cotation-form').reset();
  document.getElementById('cotation-modal').classList.remove('hidden');
}

function closeCotationModal() {
  document.getElementById('cotation-modal').classList.add('hidden');
}

function addCotation(event) {
  event.preventDefault();
  
  const formData = new FormData(event.target);
  const newAct = {
    type: formData.get('type'),
    code: formData.get('code').toUpperCase(),
    libelle: formData.get('code'), // In production, lookup from nomenclature
    modifiers: formData.get('modifiers'),
    quantite: formData.get('quantity'),
    description: formData.get('description'),
    montant: 0 // In production, lookup from nomenclature
  };

  // Validation
  if (!newAct.type || !newAct.code) {
    alert('Veuillez remplir tous les champs requis');
    return;
  }

  cotations.push(newAct);
  renderCotationsTable();
  closeCotationModal();
}

function updateCotation(idx, field, value) {
  if (idx >= 0 && idx < cotations.length) {
    cotations[idx][field] = value;
    renderCotationsTable();
  }
}

function editCotation(idx) {
  if (idx >= 0 && idx < cotations.length) {
    const act = cotations[idx];
    document.getElementById('cotation-type').value = act.type;
    document.getElementById('cotation-code').value = act.code;
    document.querySelector('[name="modifiers"]').value = act.modifiers || '';
    document.querySelector('[name="quantity"]').value = act.quantite || 1;
    document.querySelector('[name="description"]').value = act.description || '';
    
    // Change to "Edit" mode and handle on submit
    showAddCotationForm();
  }
}

function deleteCotation(idx) {
  if (confirm('Êtes-vous sûr de vouloir supprimer cette cotation ?')) {
    cotations.splice(idx, 1);
    renderCotationsTable();
  }
}

// Event listeners
document.getElementById('cotation-form')?.addEventListener('submit', addCotation);
document.getElementById('cotation-type')?.addEventListener('change', function() {
  document.getElementById('details-container').style.display = this.value ? 'grid' : 'none';
});

// Initialize on load
document.addEventListener('DOMContentLoaded', renderCotationsTable);
</script>
