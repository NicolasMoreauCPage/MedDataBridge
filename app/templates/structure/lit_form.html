{% extends "base.html" %}

{% block title %}Modifier Lit{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 py-6">
  <!-- Breadcrumb -->
  <nav class="flex items-center space-x-2 text-sm text-slate-600 mb-6">
    <a href="/" class="hover:text-blue-600 transition-colors">🏠 Accueil</a>
    <span class="text-slate-400">/</span>
    <span class="text-slate-800 font-medium">Modifier le lit</span>
  </nav>

  <!-- Header -->
  <div class="mb-8">
    <div class="bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 rounded-2xl p-8 text-white shadow-lg">
      <div class="flex items-center space-x-4">
        <div class="bg-white/20 backdrop-blur-sm rounded-xl p-3">
          <div class="text-3xl">📝</div>
        </div>
        <div>
          <h1 class="text-3xl font-bold">Modifier le lit</h1>
        </div>
      </div>
    </div>
  </div>

  <h2 class="text-2xl font-bold leading-7 text-gray-900 sm:truncate sm:text-3xl sm:tracking-tight mb-8">
    Modifier le lit {{ lit.name }}
  </h2>

  <form method="POST" action="/structure/lits/{{ lit.id }}" class="space-y-6">
    <div>
      <label for="name" class="block text-sm font-medium leading-6 text-gray-900">Nom</label>
      <div class="mt-2">
        <input type="text" name="name" id="name" required 
          value="{{ lit.name }}"
          class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6">
      </div>
    </div>

    <div>
      <label for="identifier" class="block text-sm font-medium leading-6 text-gray-900">Identifiant</label>
      <div class="mt-2">
        <input type="text" name="identifier" id="identifier"
          value="{{ lit.identifier }}"
          class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6">
      </div>
    </div>

    <div>
      <label for="chambre_id" class="block text-sm font-medium leading-6 text-gray-900">Chambre</label>
      <div class="mt-2">
        <select name="chambre_id" id="chambre_id" required
          class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600">
          {% for ch in chambres %}
          <option value="{{ ch.id }}" {% if lit.chambre_id == ch.id %}selected{% endif %}>{{ ch.name }} ({{ ch.identifier }})</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div>
      <label for="status" class="block text-sm font-medium leading-6 text-gray-900">Statut</label>
      <div class="mt-2">
          <select name="status" id="status" class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600">
              <option value="">-- Sélectionner --</option>
              {% for opt in status_options %}
                  <option value="{{ opt.value }}" {% if lit and lit.status == opt.value %}selected{% endif %}>{{ opt.label }}</option>
              {% endfor %}
        </select>
      </div>
    </div>

    <div>
      <label for="operational_status" class="block text-sm font-medium leading-6 text-gray-900">Statut opérationnel</label>
      <div class="mt-2">
        <select name="operational_status" id="operational_status"
          class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600">
          {% if lit.operational_status and lit.operational_status not in operational_statuses %}
          <option value="{{ lit.operational_status }}" selected>{{ lit.operational_status }}</option>
          {% endif %}
          {% for s in operational_statuses %}
          <option value="{{ s }}" {% if lit.operational_status == s %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="flex justify-end gap-x-3">
      <a href="/structure/chambres/{{ lit.chambre_id }}" 
         class="rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50">
        Annuler
      </a>
      <button type="submit" class="rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
        Enregistrer
      </button>
    </div>
  </form>
</div>
{% endblock %}
