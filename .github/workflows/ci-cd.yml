# .github/workflows/ci-cd.yml
"""
Configuration GitHub Actions pour CI/CD avec tests automatisés
Pipeline complet: tests parallèles, couverture, sécurité, déploiement
"""

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Tests quotidiens à 2h du matin
    - cron: '0 2 * * *'

jobs:
  test:
    name: Tests Automatisés
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.11, 3.13]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test,dev]

    - name: Run tests unitaires (rapides)
      run: |
        pytest tests/unit/ -v --tb=short --cov=app --cov-report=xml --cov-report=html --cov-fail-under=85

    - name: Run tests d'intégration
      run: |
        pytest tests/integration/ -v --tb=short --cov=app --cov-append --cov-report=xml

    - name: Run tests de sécurité
      run: |
        pytest tests/security/ -v --tb=short

    - name: Run tests UI (lents)
      run: |
        pytest tests/ui/ -v --tb=short --cov=app --cov-append --cov-report=xml

    - name: Run tests de performance
      run: |
        pytest tests/performance/ -v --tb=short --durations=10

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  mutation-testing:
    name: Tests de Mutation
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, 'mutation')

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install mutmut pytest

    - name: Run mutation tests
      run: |
        mutmut run --paths-to-mutate app --tests-dir tests --runner "pytest tests/ -x --tb=short"

    - name: Generate mutation report
      run: |
        mutmut html

    - name: Upload mutation report
      uses: actions/upload-artifact@v3
      with:
        name: mutation-report
        path: html/

  security-scan:
    name: Scan de Sécurité
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Run Bandit Security Scanner
      uses: PyCQA/bandit-action@v1
      with:
        path: "app"
        options: "-r"

    - name: Run Safety (dependency vulnerabilities)
      run: |
        pip install safety
        safety check

    - name: Run Semgrep
      uses: returntocorp/semgrep-action@v1
      with:
        config: p/security-audit

  quality-check:
    name: Qualité du Code
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install quality tools
      run: |
        pip install black isort flake8 mypy radon

    - name: Check code formatting (Black)
      run: |
        black --check --diff app tests

    - name: Check imports sorting (isort)
      run: |
        isort --check-only --diff app tests

    - name: Lint code (flake8)
      run: |
        flake8 app tests --max-line-length=88 --extend-ignore=E203,W503

    - name: Type checking (mypy)
      run: |
        mypy app --ignore-missing-imports

    - name: Code complexity analysis (radon)
      run: |
        radon cc app -a -s | tee complexity.txt
        # Fail if any function has complexity > 10
        ! grep -E " [0-9]{2,}" complexity.txt

  deploy-staging:
    name: Déploiement Staging
    runs-on: ubuntu-latest
    needs: [test, security-scan, quality-check]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging

    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-1

    - name: Deploy to staging
      run: |
        # Commands de déploiement staging
        echo "🚀 Déploiement en staging..."
        # azd deploy --environment staging

  deploy-production:
    name: Déploiement Production
    runs-on: ubuntu-latest
    needs: [test, security-scan, quality-check, deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-1

    - name: Deploy to production
      run: |
        # Commands de déploiement production
        echo "🎯 Déploiement en production..."
        # azd deploy --environment production

  notify:
    name: Notifications
    runs-on: ubuntu-latest
    needs: [test, mutation-testing, security-scan, quality-check]
    if: always()

    steps:
    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Pipeline échoué"
        # Envoyer notification Teams/Slack

    - name: Notify on success
      if: success()
      run: |
        echo "✅ Pipeline réussi"
        # Envoyer notification succès

# Configuration des environnements
environments:
  staging:
    url: https://staging-api.example.com
  production:
    url: https://api.example.com

# Configuration des secrets requis
# AWS_ACCESS_KEY_ID
# AWS_SECRET_ACCESS_KEY
# DOCKER_REGISTRY_USERNAME
# DOCKER_REGISTRY_PASSWORD
# AZURE_CREDENTIALS (pour azd)</content>
