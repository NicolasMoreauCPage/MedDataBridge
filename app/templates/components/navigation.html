{% macro alerts() %}
<div id="alert-container" class="fixed top-4 right-4 space-y-4 z-50">
  <!-- Les alertes seront insérées ici dynamiquement -->
</div>
{% endmacro %}

{% macro notification(type="info", message="", dismissable=true) %}
<div class="alert alert-{{ type }} {{ 'alert-dismissible' if dismissable else '' }} fade show" role="alert">
  {{ message }}
  {% if dismissable %}
  <button type="button" class="ml-auto inline-flex items-center justify-center h-5 w-5 rounded-full hover:bg-black/10 transition-colors" aria-label="Fermer" onclick="this.closest('[role=alert]')?.remove()">&#x2715;</button>
  {% endif %}
</div>
{% endmacro %}

{% macro tooltip(content) %}
<div class="group relative inline-block">
  <span class="cursor-help">
    <svg class="w-4 h-4 text-gray-400 dark:text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
  </span>
  <div class="opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 absolute z-10 w-48 p-2 -mt-2 text-sm bg-gray-900 text-white rounded-lg shadow-lg transform -translate-x-1/2 left-1/2">
    {{ content }}
    <div class="absolute bottom-full left-1/2 transform -translate-x-1/2 border-8 border-transparent border-b-gray-900"></div>
  </div>
</div>
{% endmacro %}
