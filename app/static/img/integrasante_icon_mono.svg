<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Monochrome version for small sizes -->
  <g transform="translate(32, 32)">
    <!-- Connection lines -->
    <line x1="0" y1="0" x2="-12" y2="-12" stroke="#1E293B" stroke-width="2.5" opacity="0.7"/>
    <line x1="0" y1="0" x2="12" y2="-12" stroke="#1E293B" stroke-width="2.5" opacity="0.7"/>
    <line x1="0" y1="0" x2="-12" y2="12" stroke="#1E293B" stroke-width="2.5" opacity="0.7"/>
    <line x1="0" y1="0" x2="12" y2="12" stroke="#1E293B" stroke-width="2.5" opacity="0.7"/>
    
    <!-- Peripheral nodes -->
    <circle cx="-12" cy="-12" r="3.5" fill="#1E293B" stroke="white" stroke-width="2"/>
    <circle cx="12" cy="-12" r="3.5" fill="#1E293B" stroke="white" stroke-width="2"/>
    <circle cx="-12" cy="12" r="3.5" fill="#1E293B" stroke="white" stroke-width="2"/>
    <circle cx="12" cy="12" r="3.5" fill="#1E293B" stroke="white" stroke-width="2"/>
    
    <!-- Central node -->
    <circle cx="0" cy="0" r="7" fill="#1E293B" stroke="white" stroke-width="2.5"/>
    
    <!-- Center icon -->
    <line x1="-3" y1="0" x2="3" y2="0" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-3" x2="0" y2="3" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" fill="white"/>
  </g>
</svg>
