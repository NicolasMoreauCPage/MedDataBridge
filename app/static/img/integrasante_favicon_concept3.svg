<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fav3-network-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="fav3-center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" fill="white" rx="12"/>
  
  <!-- Network icon -->
  <g transform="translate(32, 32)">
    <!-- Background glow -->
    <circle cx="0" cy="0" r="20" fill="url(#fav3-center-glow)"/>
    
    <!-- Connection lines -->
    <line x1="0" y1="0" x2="-12" y2="-12" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="12" y2="-12" stroke="#8B5CF6" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="-12" y2="12" stroke="#8B5CF6" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="12" y2="12" stroke="#A855F7" stroke-width="2" opacity="0.6"/>
    
    <!-- Peripheral nodes -->
    <circle cx="-12" cy="-12" r="3" fill="#3B82F6" stroke="white" stroke-width="1.5"/>
    <circle cx="12" cy="-12" r="3" fill="#8B5CF6" stroke="white" stroke-width="1.5"/>
    <circle cx="-12" cy="12" r="3" fill="#8B5CF6" stroke="white" stroke-width="1.5"/>
    <circle cx="12" cy="12" r="3" fill="#A855F7" stroke="white" stroke-width="1.5"/>
    
    <!-- Central node -->
    <circle cx="0" cy="0" r="6" fill="url(#fav3-network-gradient)" stroke="white" stroke-width="2"/>
    
    <!-- Center icon -->
    <line x1="-2.5" y1="0" x2="2.5" y2="0" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="-2.5" x2="0" y2="2.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1" fill="white"/>
  </g>
</svg>
