[pytest]
addopts = -q --strict-markers -m "not external and not ui and not e2e and not performance"
pythonpath = .
# Disable loading root tests/conftest.py to avoid external dependencies
norecursedirs = tests
markers =
	unit: Fast unit tests with mocked dependencies
	api: API endpoint tests
	security: Tests liés à l'authentification et aux autorisations
	integration: Integration tests testing real component interactions
	ui: User interface tests requiring browser/playwright
	e2e: End-to-end tests requiring a full application stack
	e2e_integration: End-to-end integration tests requiring a full stack
	e2e_phase5_1: Historical Phase 5.1 end-to-end tests
	e2e_phase5_2: Historical Phase 5.2 end-to-end tests
	e2e_phase5_3: Historical Phase 5.3 end-to-end tests
	e2e_phase6: Phase 6 end-to-end tests (dossiers/venues)
	performance: Performance and load tests
	external: Tests requiring a manually started server or a third-party service
	coverage: Tests related to coverage measurement
	mutation: Mutation testing for test quality validation
	property: Property-based tests using hypothesis for edge case validation
	slow: Tests taking longer than 30 seconds
	critical: Critical functionality that must always work
	flaky: Tests that may fail intermittently (needs investigation)
filterwarnings =
	ignore::sqlalchemy.exc.SAWarning
	ignore:Support for class-based `config` is deprecated.*:DeprecationWarning
	ignore:The `dict` method is deprecated; use `model_dump` instead.*:DeprecationWarning
