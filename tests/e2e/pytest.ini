[pytest]
# Configuration spécifique pour les tests E2E Phase 5

# Chemins de tests E2E
testpaths = tests/e2e

# Markers spécifiques Phase 5 E2E
markers =
    e2e_phase5_1: Tests E2E Phase 5.1 - UX Interactive
    e2e_phase5_2: Tests E2E Phase 5.2 - Design System Hospitalier
    e2e_phase5_3: Tests E2E Phase 5.3 - Interface Recherche Avancée
    e2e_integration: Tests E2E d'intégration cross-phases Phase 5
    slow_e2e: Tests E2E lents (>30 secondes)
    critical_e2e: Tests E2E critiques qui ne doivent jamais échouer
    visual_e2e: Tests E2E avec vérifications visuelles

# Options par défaut pour les tests E2E
addopts = 
    --strict-markers
    --tb=short
    --maxfail=5
    --timeout=300
    --timeout-method=thread
    -v

# Filtres d'avertissements spécifiques aux tests E2E
filterwarnings =
    ignore::DeprecationWarning:playwright.*
    ignore::UserWarning:requests.*
    ignore::sqlalchemy.exc.SAWarning

# Variables d'environnement pour les tests E2E
env =
    TESTING = 1
    E2E_TESTING = 1
    PLAYWRIGHT_HEADLESS = 1