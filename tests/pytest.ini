[pytest]
addopts = -q -m "not external and not ui and not e2e and not performance"
pythonpath = .
# Disable loading root tests/conftest.py to avoid external dependencies
norecursedirs = tests
markers =
	security: Tests liés à l'authentification et aux autorisations
	integration: Integration tests testing real component interactions
	ui: User interface tests requiring browser/playwright
	e2e: End-to-end tests requiring a full application stack
	performance: Performance and load tests
	external: Tests requiring a manually started server or a third-party service
filterwarnings =
	ignore::sqlalchemy.exc.SAWarning
	ignore:Support for class-based `config` is deprecated.*:DeprecationWarning
	ignore:The `dict` method is deprecated; use `model_dump` instead.*:DeprecationWarning
